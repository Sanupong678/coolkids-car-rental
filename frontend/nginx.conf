# Production web server for the built SPA (see Dockerfile.prod).
# Serves dist/, proxies /api and /uploads to the API container, and sets the
# browser security headers the dev server cannot (CSP, HSTS, framing, etc.).
# TLS is expected to terminate in front of this (load balancer / Cloudflare /
# Caddy); HSTS tells browsers to never use plain HTTP again.

server_tokens off;

# Caddy (deploy/Caddyfile) terminates TLS on the private Docker network and passes the
# visitor's IP in X-Real-IP, so the per-IP limits below count visitors, not Caddy.
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
set_real_ip_from 10.0.0.0/8;
real_ip_header X-Real-IP;

# The scheme the visitor used (https from Caddy), passed on to the API.
map $http_x_forwarded_proto $forwarded_proto {
  default $scheme;
  https   https;
}

# Per-IP request budgets in front of the API (the API has its own limits too).
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
limit_conn_zone $binary_remote_addr zone=conn:10m;

upstream api {
  server api:5000;
  keepalive 16;
}

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;

  client_max_body_size 9m;          # largest legal upload is an 8 MB car photo
  client_body_timeout 15s;
  client_header_timeout 15s;
  keepalive_timeout 30s;
  send_timeout 30s;
  limit_conn conn 40;

  # ---- security headers (sent on every response, incl. errors)
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://tile.openstreetmap.org https://images.unsplash.com https://*.googleusercontent.com https://*.fbsbx.com https://profile.line-scdn.net; media-src 'self'; connect-src 'self' https://api.line.me https://liff.line.me https://*.line-scdn.net; frame-src 'self' https://www.openstreetmap.org; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests" always;
  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "geolocation=(self), camera=(), microphone=(), payment=(), usb=(), interest-cohort=()" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;

  # Never serve dotfiles, source maps or backup files.
  location ~ /\. { deny all; return 404; }
  location ~* \.(map|bak|orig|swp|env)$ { deny all; return 404; }

  location /api/v1/auth/ {
    limit_req zone=auth burst=10 nodelay;
    proxy_pass http://api;
    include /etc/nginx/proxy_params_ck;
  }

  location /api/ {
    limit_req zone=api burst=40 nodelay;
    proxy_pass http://api;
    include /etc/nginx/proxy_params_ck;
  }

  location /uploads/ {
    proxy_pass http://api;
    include /etc/nginx/proxy_params_ck;
  }

  # Hashed build assets are immutable.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  # SPA routes fall back to index.html, which is never cached.
  location / {
    try_files $uri $uri/ /index.html;
  }
  location = /index.html {
    add_header Cache-Control "no-store" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://tile.openstreetmap.org https://images.unsplash.com https://*.googleusercontent.com https://*.fbsbx.com https://profile.line-scdn.net; media-src 'self'; connect-src 'self' https://api.line.me https://liff.line.me https://*.line-scdn.net; frame-src 'self' https://www.openstreetmap.org; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(self), camera=(), microphone=(), payment=(), usb=(), interest-cohort=()" always;
  }
}
