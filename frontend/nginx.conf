# Production web server for the built SPA (see Dockerfile.prod).
# Serves dist/, proxies /api and /uploads to the API container, and sets the
# browser security headers the dev server cannot (CSP, HSTS, framing, etc.).
# TLS is expected to terminate in front of this (load balancer / Cloudflare /
# Caddy); HSTS tells browsers to never use plain HTTP again.

server_tokens off;

# Caddy (deploy/Caddyfile) terminates TLS on the private Docker network and passes the
# visitor's IP in X-Real-IP, so the per-IP limits below count visitors, not Caddy.
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
set_real_ip_from 10.0.0.0/8;
real_ip_header X-Real-IP;

# The scheme the visitor used (https from Caddy), passed on to the API.
map $http_x_forwarded_proto $forwarded_proto {
  default $scheme;
  https   https;
}

# Per-IP request budgets in front of the API (the API has its own limits too).
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
limit_conn_zone $binary_remote_addr zone=conn:10m;

upstream api {
  server api:5000;
  keepalive 16;
}

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;

  client_max_body_size 9m;          # largest legal upload is an 8 MB car photo
  client_body_timeout 15s;
  client_header_timeout 15s;
  keepalive_timeout 30s;
  send_timeout 30s;
  limit_conn conn 40;

  # ---- security headers (sent on every response, incl. errors)
  include /etc/nginx/security_headers_ck;
  add_header Cross-Origin-Resource-Policy "same-site" always;

  # Never serve dotfiles, source maps or backup files.
  location ~ /\. { deny all; return 404; }
  location ~* \.(map|bak|orig|swp|env)$ { deny all; return 404; }

  location /api/v1/auth/ {
    limit_req zone=auth burst=10 nodelay;
    proxy_pass http://api;
    include /etc/nginx/proxy_params_ck;
  }

  location /api/ {
    limit_req zone=api burst=40 nodelay;
    proxy_pass http://api;
    include /etc/nginx/proxy_params_ck;
  }

  location /uploads/ {
    proxy_pass http://api;
    include /etc/nginx/proxy_params_ck;
  }

  # Public images (logo, e-mail icons, car pictures) are shown by other origins too: the
  # receipt / contract PDFs are rendered from a local file, and e-mails load them from the
  # mail client. same-site here blanked the receipt logo.
  # Cached for a day (then used while re-checked in the background), so reopening the
  # site on a phone doesn't re-ask the server about every picture and the hero clip.
  location ~ ^/(brand|media|cars|contract)/ {
    include /etc/nginx/security_headers_ck;
    add_header Cross-Origin-Resource-Policy "cross-origin" always;
    add_header Cache-Control "public, max-age=86400, stale-while-revalidate=604800" always;
    try_files $uri =404;
  }

  # Hashed build assets are immutable.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable" always;
    include /etc/nginx/security_headers_ck; # its own add_header drops the server-level ones
    add_header Cross-Origin-Resource-Policy "same-site" always;
    try_files $uri =404;
  }

  # SPA routes fall back to index.html, which is never cached.
  location / {
    try_files $uri $uri/ /index.html;
  }
  location = /index.html {
    add_header Cache-Control "no-store" always;
    include /etc/nginx/security_headers_ck;
    add_header Cross-Origin-Resource-Policy "same-site" always;
  }
}
